name: Publish webdriver-js-cli

# Releases are cut by pushing a version tag, so ordinary pushes never reach
# npm. The tag names the package, since each of the four has its own version.
on:
  push:
    tags: [ "webdriver-js-cli@0.*.*" ]

permissions: { }

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      package: webdriver-js-cli
    permissions:
      contents: read
      id-token: write
