<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>{{title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/styles/test-assert-lite.css"/>
    <!-- The page people open, from the CLI's --serve mode. It shows the
         HTML reporter for whatever the CLI mounted; browser/run.html, served
         under each run's URL, is the one the CLI drives itself. The CLI
         serves this page with the import map, the classic scripts, the
         library's own build first, and the suites added at the end of the
         head. -->
    <script type="module">
        // Module scripts run once the page is parsed, in order: this one
        // first, the suites the CLI adds after it. The face by its own URL,
        // since the import map comes later in the head.
        import {reporter, session} from "/@tal/exports/global.mjs";

        session({
            format: reporter.html(),
            output: text => document.querySelector("#output")?.insertAdjacentHTML("beforeend", text),
        });
    </script>
</head>
<body>
<h1>{{title}}</h1>
<div id="output"></div>
<script type="module">
    import {run} from "/@tal/exports/global.mjs";

    await run().catch(console.error);
</script>
</body>
</html>
