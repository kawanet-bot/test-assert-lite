<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>{{title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/styles/test-assert-lite.css"/>
</head>
<body>
<h1>{{title}}</h1>
<div id="output"></div>
<script type="module">
    import {end, reporter, session} from "test-assert-lite";

    session({
        reporter: reporter.html(),
        output: text => document.querySelector("#output")?.insertAdjacentHTML("beforeend", text),
    });

    // --serve --alias index.js=path/to/index.js
    await import("index.js");

    await end().catch(console.error);
</script>
</body>
</html>
