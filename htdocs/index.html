<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>test-assert-lite browser test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/styles/test-assert-lite.css"/>
    <!-- The page people open, from the CLI's --serve mode. It shows the
         HTML reporter for whatever the CLI mounted; browser/run.html, served
         under each run's URL, is the one the CLI drives itself. The CLI
         serves this page with the import map, the classic scripts, the
         library's own build first, and the suites added at the end of the
         head. -->
</head>
<body>
<h1>test-assert-lite browser test</h1>
<div id="output"></div>
<script type="module">
    // The suites came in the head, put there by the CLI, so they are
    // registered by now: only the reporter is this page's own, set before
    // run() reads it.
    const {reporter, run} = await import("test-assert-lite");

    reporter.format(reporter.html());
    reporter.output(text => document.querySelector("#output")?.insertAdjacentHTML("beforeend", text));
    await run().catch(console.error);
</script>
</body>
</html>
