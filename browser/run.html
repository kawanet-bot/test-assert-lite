<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>{{title}}</title>
    <!-- The page the CLI drives, through Playwright or a WebDriver server
         alike, served under the run's own URL and reporting back there;
         the <pre> below is for a person watching the browser. The CLI adds
         the import map, the classic scripts and the suites at the end of
         the head. index.html, at the root, is the page people open. -->
    <script type="module">
        // Module scripts run once the page is parsed, in order: this one
        // first, the suites the CLI adds after it. The import map the CLI
        // puts ahead of this script gives the package's name.
        import {session} from "test-assert-lite";

        // The run's URL is this page's own directory: the session reports
        // there, takes the errors outside the tests, and the console goes
        // the same way.
        const {stdout, stderr} = session({
            base: new URL("./", import.meta.url),
            capture: true,
            output: text => {
                document.querySelector("#output")?.append(text);
                stdout(text);
            },
        });
        for (const level of ["log", "info", "debug"]) console[level] = (...args) => stdout(`${args.join(" ")}\n`);
        for (const level of ["warn", "error"]) console[level] = (...args) => stderr(args.join(" "));
    </script>
</head>
<body>
<pre id="output"></pre>
<script type="module">
    import {end, run} from "test-assert-lite";

    try {
        const summary = await run();
        await end(summary.success);
    } catch (error) {
        console.error(error || "Error");
        await end(false);
    }
</script>
</body>
</html>
