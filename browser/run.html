<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>{{title}}</title>
    <!-- The page the CLI drives, through Playwright or a WebDriver server
         alike, served under the run's own URL and reporting back there. The
         library comes first, by its own URL, so the session is open ahead of
         what the CLI adds to the head; the <pre> below is for a person
         watching the browser. index.html, at the root, is the page people open. -->
    <script src="/@tal/dist/test-assert-lite.min.js"></script>
    <script>
        // The run's URL is this page's own directory: the session reports
        // there, and the console and the errors go the same way.
        (() => {
            const {stdout, stderr} = TAL.session({
                base: new URL("./", location.href),
                output: text => {
                    document.querySelector("#output")?.append(text);
                    stdout(text);
                },
            });
            const tal = window["@tal"] = {failed: false};
            for (const level of ["log", "info", "debug"]) console[level] = (...args) => stdout(`${args.join(" ")}\n`);
            for (const level of ["warn", "error"]) console[level] = (...args) => stderr(args.join(" "));
            addEventListener("error", event => { tal.failed = true; stderr(event.error || event.reason || String(event)); }, true);
            addEventListener("unhandledrejection", event => { tal.failed = true; stderr(event.reason || String(event)); });
        })();
    </script>
</head>
<body>
<pre id="output"></pre>
<script type="module">
    // An error before the run, a suite or a script that did not load or
    // threw, means the run does not start, as under node --test.
    const {run, end} = TAL;
    const tal = window["@tal"];
    if (tal.failed) {
        await end(false);
    } else {
        try {
            const summary = await run();
            await end(summary.success && !tal.failed);
        } catch (error) {
            console.error(error || "Error");
            await end(false);
        }
    }
</script>
</body>
</html>
