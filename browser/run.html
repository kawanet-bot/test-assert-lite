<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>test-assert-lite browser test</title>
    <!-- The page the CLI drives, through Playwright or a WebDriver server
         alike. It is served under the run's own URL and reports back there
         over HTTP: begin, the two streams and the verdict at the end; the
         <pre> below is for a person watching the browser. The CLI serves it
         with the import map and the classic scripts added at the end of
         the head. index.html, at the root, is the page people open. -->
</head>
<body>
<pre id="output"></pre>
<script type="module">
    // The run's URL is this page's own directory, and the library's client
    // reports to it: nothing else on the network knows that URL.
    const {reporter, run} = await import("test-assert-lite");
    const {begin, stdout, stderr, end} = reporter.client(new URL("./", import.meta.url));
    begin();

    // An error outside a test body, an uncaught one or a suite that failed
    // to load, is shown as it happens and fails the run at the end.
    let uncaught = 0;
    addEventListener("error", event => { uncaught++; stderr(`${event.error?.stack ?? event.message}\n`); });
    addEventListener("unhandledrejection", event => { uncaught++; stderr(`${event.reason?.stack ?? event.reason}\n`); });

    // The console goes to the CLI's streams the way Node's does.
    for (const level of ["log", "info", "debug"]) console[level] = (...args) => stdout(`${args.join(" ")}\n`);
    for (const level of ["warn", "error"]) console[level] = (...args) => stderr(`${args.join(" ")}\n`);

    const output = document.querySelector("#output");
    try {
        // One at a time, so the suites register in command-line order.
        for (const url of await (await fetch("/@tal/tests.json")).json()) {
            await import(url);
        }

        // The spec reporter, the default, stays without colours in a browser.
        reporter.output(text => {
            output.append(text);
            stdout(text);
        });
        const summary = await run();
        await end(summary.success && uncaught === 0);
    } catch (error) {
        stderr(`${error?.stack ?? error}\n`);
        await end(false);
    }
</script>
</body>
</html>
