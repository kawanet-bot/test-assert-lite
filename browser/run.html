<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>test-assert-lite browser test</title>
    <!-- The page the CLI drives, through Playwright or a WebDriver server
         alike. It is served under the run's own URL and reports back there
         over HTTP: begin, the two streams and the verdict at the end; the
         <pre> below is for a person watching the browser. The CLI serves it
         with the import map, the classic scripts and the suites added at
         the end of the head. index.html, at the root, is the page people
         open. -->
    <script>
        // Ahead of everything the CLI puts into the page, so what fails to
        // load or throws before the module below runs is kept for it.
        window.testErrors = [];
        addEventListener("error", event => window.testErrors.push(event), true);
        addEventListener("unhandledrejection", event => window.testErrors.push(event));
    </script>
</head>
<body>
<pre id="output"></pre>
<script type="module">
    // The run's URL is this page's own directory, and the library's client
    // reports to it: nothing else on the network knows that URL.
    const {reporter, run} = await import("test-assert-lite");
    const {begin, stdout, stderr, end} = reporter.client(new URL("./", import.meta.url));
    begin();

    // Whatever the head kept, shown once and counted; the array stays a
    // queue for what arrives during the run.
    let failed = false;
    const flush = () => {
        while (window.testErrors.length > 0) {
            const event = window.testErrors.shift();
            stderr(event.error || event.reason || String(event));
            failed = true;
        }
    };

    // The console goes to the CLI's streams the way Node's does.
    for (const level of ["log", "info", "debug"]) console[level] = (...args) => stdout(`${args.join(" ")}\n`);
    for (const level of ["warn", "error"]) console[level] = (...args) => stderr(args.join(" "));

    // The spec reporter, the default, stays without colours in a browser.
    const output = document.querySelector("#output");
    reporter.output(text => {
        output.append(text);
        stdout(text);
    });

    // An error before the run, a suite or a script that did not load or
    // threw, means the run does not start, as under node --test.
    flush();
    if (failed) {
        await end(false);
    } else {
        try {
            const summary = await run();
            flush();
            await end(summary.success && !failed);
        } catch (error) {
            stderr(error || "Error");
            await end(false);
        }
    }
</script>
</body>
</html>
