<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>{{title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<pre id="output"></pre>
<script type="module">
    import {connect, stdout} from "test-assert-lite/process"
    import {load, run, session} from "test-assert-lite/session"

    const json = document.querySelector(`script[type="application/vnd.tacli-config+json"]`)?.textContent
    const config = json ? JSON.parse(json) : {}
    const channel = connect({
        ...(config.connect ?? {}),
        fetch,
    })

    session({
        ...(config.session ?? {}),
        channel,
        uncaught: window,
        console: console,
        output: (text) => {
            document.querySelector("#output")?.append(text)
            channel.stdout.write(text)
        },
    })

    const files = (config.files ?? [])

    for (const file of files) {
        await load(file)
    }

    await run().catch(console.error)
</script>
</body>
</html>
